<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128" type="image/x-icon">
  <link rel="stylesheet" type="text/css" href="fontawesome-free-7.2.0-web/css/all.min.css?v=202608240324">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+JP:wght@100..900&family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=202608240324">
  <title>L Chat</title>
</head>

<body>
  <div id="identityModeOverlay" class="identity-mode-overlay" style="display:none;">
    <div class="identity-mode-dialog">
      <h2>选择使用模式</h2>
      <p>游客模式保留现有 24 小时临时 ID；永久账号无需注册，可在本设备恢复使用。</p>
      <div class="identity-mode-actions">
        <button type="button" data-mode="guest">游客模式</button>
        <button type="button" data-mode="permanent">创建/使用永久账号</button>
      </div>
    </div>
  </div>
  <div id="identitySwitchConfirmOverlay" class="identity-mode-overlay" style="display:none;">
    <div class="identity-mode-dialog">
      <h2>确认切换账号模式</h2>
      <p id="identitySwitchConfirmText">切换模式后将清理当前模式的会话列表和备注，确定继续吗？</p>
      <div class="identity-mode-actions">
        <button id="identitySwitchCancelBtn" type="button">取消</button>
        <button id="identitySwitchConfirmBtn" type="button">确认切换</button>
      </div>
    </div>
  </div>
  <div id="permanentAccountChoiceOverlay" class="identity-mode-overlay" style="display:none;">
    <div class="identity-mode-dialog">
      <h2>永久账号</h2>
      <p>如果你已有导出的账号凭据，请选择恢复，避免重复创建永久账号。</p>
      <div class="identity-mode-actions">
        <button id="createPermanentAccountBtn" type="button">创建新账号</button>
        <button id="restorePermanentAccountBtn" type="button">使用凭据恢复</button>
      </div>
      <input id="permanentCredentialInput" type="file" accept="application/json" hidden>
    </div>
  </div>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-header-title">
          <i class="fa-solid fa-comments"></i> 会话列表
        </div>
        <div class="connection-status connecting" id="connectionStatus" title="连接中">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span>连接中</span>
        </div>
      </div>
      <div class="sessions" id="sessions"></div>
      <div class="sidebar-footer">
        <div id="identityLabel" style="display:flex;align-items:center;gap:6px;margin-bottom:4px">我的ID（24H 有效期）</div>
        <div id="myId"></div>
        <div class="account-actions">
          <button id="exportAccountBtn" type="button" title="导出永久账号凭据"><i class="fa-solid fa-download"></i> 导出凭据</button>
          <button id="importAccountBtn" type="button" title="导入永久账号凭据"><i class="fa-solid fa-upload"></i> 导入凭据</button>
          <input id="accountCredentialInput" type="file" accept="application/json" hidden>
        </div>
        <button id="switchIdentityModeBtn" class="switch-identity-btn" type="button"></button>
        <input id="targetId" placeholder="输入对方ID">
        <button id="sendRequestBtn">
          <i class="fa-solid fa-paper-plane"></i> 发送请求
        </button>
      </div>
    </div>

    <div class="chat">
      <div class="chat-header" id="title">
        <i class="fa-solid fa-message"></i> 请选择会话
      </div>
      <div class="messages" id="msgBox"></div>
      <div class="input-bar">
        <input type="file" id="fileInput" accept="image/*" style="display:none" multiple>
        <input type="file" id="docInput" style="display:none">
        <button class="emoji-btn" id="emojiBtn" title="表情">
          <i class="fa-regular fa-face-smile"></i>
        </button>
        <button class="attach-btn" id="imageBtn" title="发送图片">
          <i class="fa-solid fa-image"></i>
        </button>
        <button class="attach-btn" id="fileBtn" title="发送文件">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <textarea id="msgInput" placeholder="输入消息" rows="1"></textarea>
        <button class="send">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
      <!-- 上传进度条 -->
      <div class="upload-progress" id="uploadProgress" style="display:none">
        <div class="upload-progress-bar" id="uploadProgressBar"></div>
        <div class="upload-progress-row">
          <span class="upload-progress-text" id="uploadProgressText"></span>
          <button class="upload-cancel-btn" id="uploadCancelBtn" title="取消上传">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 备注对话框 -->
  <div id="remarkModalOverlay" class="remark-modal-overlay" style="display:none;">
    <div class="remark-modal">
      <div class="remark-modal-header">设置备注</div>
      <input id="remarkInput" type="text" placeholder="请输入备注名称（20字符以内）" onkeydown="if(event.key==='Enter') confirmRemark()" />
      <div class="remark-modal-buttons">
        <button class="remark-confirm-btn" onclick="confirmRemark()">确认</button>
        <button class="remark-cancel-btn" onclick="closeRemarkModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- 图片灯箱 -->
  <div id="lightbox" class="lightbox" style="display:none">
    <span class="lightbox-close">&times;</span>
    <img id="lightboxImg" src="" alt="预览图片">
  </div>

  <!-- 通话悬浮层 -->
  <div id="callOverlay" class="call-overlay" style="display:none;">
    <div class="call-window-actions" id="callWindowActions">
      <button id="callFocusBtn" class="call-window-action-btn" title="浏览器全屏显示主画面" aria-label="浏览器全屏显示主画面"><i class="fa-solid fa-expand"></i></button>
      <button id="callPictureInPictureBtn" class="call-window-action-btn" title="在浏览器外小窗播放" aria-label="在浏览器外小窗播放"><i class="fa-solid fa-clone"></i></button>
      <button id="callMinimizeBtn" class="call-window-action-btn" title="最小化通话窗口" aria-label="最小化通话窗口"><i class="fa-solid fa-window-minimize"></i></button>
    </div>
    <button id="callRestoreBtn" class="call-window-restore-btn" title="恢复通话窗口" aria-label="恢复通话窗口"><i class="fa-solid fa-window-maximize"></i></button>
    <button id="callFocusExitBtn" class="call-focus-exit-btn" title="退出全屏" aria-label="退出全屏"><i class="fa-solid fa-compress"></i></button>
    <div class="call-overlay-top">
      <span class="call-peer-label" id="callPeerLabel"></span>
      <span class="call-status-text" id="callStatusText"></span>
      <span class="call-duration" id="callDuration"></span>
      <span class="call-conn-info" id="callConnInfo" style="display:none;"></span>
    </div>
    <div class="call-video-container" id="callVideoContainer">
      <video id="remoteVideo" class="call-remote-video" autoplay playsinline></video>
      <video id="localVideo" class="call-local-video" autoplay playsinline muted></video>
    </div>
    <div class="call-controls" id="callControls">
      <button id="callMuteBtn" class="call-ctrl-btn" title="静音"><i class="fa-solid fa-microphone"></i></button>
      <button id="callVideoBtn" class="call-ctrl-btn" title="关闭摄像头" style="display:none;"><i class="fa-solid fa-video"></i></button>
      <button id="callCameraSwitchBtn" class="call-ctrl-btn" title="切换前后摄像头" style="display:none;"><i class="fa-solid fa-camera-rotate"></i></button>
      <div class="call-audio-output-control" id="callAudioOutputControl">
        <button id="callAudioOutputBtn" class="call-ctrl-btn" title="选择音频输出" aria-haspopup="menu" aria-expanded="false"><i class="fa-solid fa-volume-high"></i></button>
        <div id="callAudioOutputMenu" class="call-audio-output-menu" role="menu" aria-label="音频输出设备" style="display:none;"></div>
      </div>
      <button id="callEndBtn" class="call-ctrl-btn call-ctrl-end" title="挂断"><i class="fa-solid fa-phone-slash"></i></button>
    </div>
  </div>

  <!-- 来电提示 -->
  <div id="callIncomingPrompt" class="call-incoming-prompt" style="display:none;"></div>

  <script src="js/config.js?v=202608240324"></script>
  <script src="js/app-state.js?v=202608240324"></script>
  <script src="js/account-module.js?v=202608240339"></script>
  <script src="js/android-screen-source-module.js?v=202608240324"></script>
  <script src="js/webrtc-module.js?v=202608240324"></script>
  <script src="js/webrtc-ui-module.js?v=202608240324"></script>
  <script src="js/uid-module.js?v=202608240324"></script>
  <script src="js/message-module.js?v=202608240324"></script>
  <script src="js/session-module.js?v=202608240324"></script>
  <script src="js/ws-module.js?v=202608240324"></script>
  <script src="js/file-upload-module.js?v=202608240324"></script>
  <script src="js/emoji-data.js?v=202608240324"></script>
  <script src="js/emoji-module.js?v=202608240324"></script>
  <script src="js/script.js?v=202608240324"></script>
</body>
</html>
